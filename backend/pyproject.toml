[project]
name = "framewise"
version = "0.1.0"
description = "Local, read-only photography curation"
requires-python = ">=3.11"
dependencies = ["fastapi==0.119.1", "uvicorn==0.38.0", "sqlalchemy==2.0.44", "pydantic==2.12.3", "pillow==12.0.0", "numpy==2.2.6", "opencv-python-headless==4.12.0.88", "imagehash==4.3.2", "platformdirs==4.5.0"]

[project.optional-dependencies]
ai = ["torch==2.9.0", "torchvision==0.24.0", "open-clip-torch==3.2.0"]
raw = ["rawpy==0.25.1"]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
